; Batas unggahan khusus aplikasi ini.
;
; Nilai bawaan PHP (upload_max_filesize 2M, post_max_size 8M) terlalu kecil
; untuk mengunggah 5 foto produk sekaligus. Saat post_max_size terlampaui,
; PHP membuang SELURUH isi POST termasuk token CSRF, sehingga permintaan
; ditolak dengan galat yang membingungkan.
;
; Berkas ini dibaca PHP-FPM per direktori, jadi php.ini sistem tidak perlu diubah.
; PHP membaca ulang berkas ini paling lama 5 menit sekali (user_ini.cache_ttl).

upload_max_filesize = 12M
post_max_size = 80M
max_file_uploads = 30
memory_limit = 256M
max_execution_time = 120
